data:
  root: /opt/dlami/nvme/sharpadex
  format: lerobot_v2.1
  fps: 30
  tasks:
  - clean_plate_with_eraser
  holdout_fraction: 0.1
  split_seed: 0
  train_episode_share: 1.0
  subset_seed: 0
  contact_threshold_n: 1.0
  use_torso: false
force:
  tactile_input: false
  torque_input: false
  force_output: false
  decision_supervision: false
vision:
  cameras:
  - head_left
  - wrist_left
  - wrist_right
  encoder: vit_small_patch14_dinov2.lvd142m
  image_size: 224
  pool_grid: 4
  batch_size: 512
  num_workers: 16
  cache_dir: /opt/dlami/nvme/sharpadex_cache
model:
  d_model: 256
  n_heads: 4
  enc_layers: 4
  dec_layers: 3
  ff_mult: 4
  dropout: 0.1
  obs_history: 6
  obs_stride: 2
  chunk: 16
  n_experts: 2
  decision:
    horizon: 10
    force_levels_n:
    - 1.0
    - 5.0
    - 15.0
train:
  seed: 0
  steps: 8000
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  amp: true
  w_action: 1.0
  w_force: 0.5
  w_decision: 0.2
  force_scale_n: 10.0
  log_every: 200
  out_root: runs
  name: eraser_force/no_force
eval:
  batch_size: 1024
  zero_force: false
  swap_task: null
  bootstrap_samples: 2000
  ci: 0.95
report:
  out_dir: reports/data
  split_dir: splits
  thresholds_sweep_n:
  - 0.25
  - 0.5
  - 1.0
  - 2.0
  - 3.0
  - 5.0
  - 10.0
  num_workers: 32
