# TacForeSight world model on SharpaDex (scripts/tf_train.py fills the CAPITALISED values from configs/default.yaml).
# Differences from TacForeSight's config/dynamics_train.yaml: the two condition streams. Its `force` slot carries the joint commands of the
# frames being predicted (so the model is driven by what the policy does) and its `state` slot the measured joints; 58-D each.
task: dynamics
seed: 42
runtime:
  device: cuda
output:
  root_dir: OUT_DIR
  run_name: RUN_NAME
data:
  root_dir: DATA_DIR
  format: zarr
  window_size: 16
  stride: 1
  pad_to_multiple_of_4: true
  normalize_keys:
  - tactile
  - force_4x
  - state_4x
  keys:
    force: command_next_4x
    state: state_4x
    tactile_left: tactile_left
    tactile_right: tactile_right
    action: null
model:
  backend: {}
  policy: {}
  dynamics:
    chunk_horizon: HORIZON
    chunk_stride: 1
    future_shift: HORIZON
    use_delta_latent: false
    model_dim: 384
    tactile_embed_dim: 128
    dropout: 0.15
    max_seq_len: 32
    tactile_in_channels: 3
    tactile_hand_dim: 48
    tactile_hidden_channels: 64
    tactile_mid_channels: 128
    tactile_depth: 4
    tactile_heads: 4
    force_dim: 58
    state_dim: 58
    cond_dim: 128
    cond_hidden_dim: 256
    use_force: true
    use_state: true
    use_delta_force: false
    use_delta_state: false
    cond_branch_depth: 1
    cond_kernel_size: 5
    depth: 4
    heads: 8
    dim_head: 64
    mlp_dim: 512
    use_condition: true
    mse_weight: 1.0
    delta_latent_weight: 1.0
    sigreg_weight: 0.09
    sigreg_knots: 17
    sigreg_num_proj: 512
train:
  batch_size: BATCH
  val_batch_size: BATCH
  num_workers: 12
  ddp_num_workers: 12
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  epochs: EPOCHS
  grad_clip: null
  use_amp: true
  lr_warmup_steps: 1000
  optimizer:
    lr: 0.0003
    min_lr: 1.0e-06
    weight_decay: 1.0e-05
checkpoint:
  load_path: ${output.root_dir}/${output.run_name}/checkpoints/best_model.pt
  save_every: 1
  val_every: 1
  best_metric: loss_mse
